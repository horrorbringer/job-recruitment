<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dashboard}">
<head>
    <title>Saved Jobs | JobPortal</title>
</head>
<body>
<main layout:fragment="content" class="bg-light">
    <!-- Header -->
    <div class="row mb-5 align-items-center">
        <div class="col-md-8">
            <h2 class="fw-bold text-dark mb-1"><i class="bi bi-bookmark-heart text-warning me-2"></i>Saved Jobs</h2>
            <p class="text-muted mb-0">Review and apply for the jobs you've bookmarked.</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <a th:href="@{/jobs/search}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-search me-2"></i>Find More Jobs
            </a>
        </div>
    </div>

    <!-- Saved Jobs List -->
    <div class="row g-4">
        <div class="col-12" th:if="${not #lists.isEmpty(savedJobs)}">
            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
                <div th:each="job : ${savedJobs}" class="col" th:id="'job-card-' + ${job.id}">
                    <div class="card h-100 border-0 shadow-sm hover-shadow transition-all dashboard-card-hover">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-light rounded p-2" style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
                                    <i class="bi bi-building fs-4 text-primary"></i>
                                </div>
                                <button class="btn btn-light btn-sm rounded-circle shadow-sm text-warning" th:onclick="'toggleSave(' + ${job.id} + ')'">
                                    <i class="bi bi-bookmark-fill fs-5"></i>
                                </button>
                            </div>
                            <h5 class="fw-bold mb-1">
                                <a th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.title}" class="text-dark text-decoration-none">Senior Developer</a>
                            </h5>
                            <p class="text-primary fw-semibold small mb-3" th:text="${job.recruiter?.companyName}">Acme Corp</p>
                            
                            <div class="d-flex flex-wrap gap-2 mb-4">
                                <span class="badge bg-soft-info text-primary rounded-pill small" th:text="${job.jobType}">Full Time</span>
                                <span class="text-muted small"><i class="bi bi-geo-alt me-1"></i><span th:text="${job.location}">Remote</span></span>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
                                <div class="text-dark fw-bold" th:text="${'$' + job.salaryMin}">$5,000</div>
                                <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-primary btn-sm rounded-pill px-4">Apply Now</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(savedJobs)}">
            <div class="icon-circle bg-light text-muted mx-auto mb-4" style="width: 100px; height: 100px;">
                <i class="bi bi-bookmark fs-1"></i>
            </div>
            <h4 class="fw-bold">No Saved Jobs</h4>
            <p class="text-muted mb-4 px-5">Found something interesting? Bookmark it and it will show up here for you to apply later.</p>
            <a th:href="@{/jobs/search}" class="btn btn-primary btn-lg px-5">Browse Jobs</a>
        </div>
    </div>
</main>

<script layout:fragment="script">
    function toggleSave(jobId) {
        if (!confirm('Remove this job from your saved list?')) return;
        
        fetch('/job-seeker/saved-jobs/toggle/' + jobId, {
            method: 'POST',
            headers: {
                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').content
            }
        }).then(response => response.text())
        .then(data => {
            if (data === 'removed') {
                document.getElementById('job-card-' + jobId).remove();
                if (document.querySelectorAll('[id^="job-card-"]').length === 0) {
                    location.reload();
                }
            }
        });
    }
</script>
</body>
</html>
