<aside th:fragment="sidebar" class="sidebar" id="sidebar" data-collapsed="false">
    <button type="button" class="sidebar-toggle" id="sidebarToggle">
        <i class="bi bi-chevron-left"></i>
    </button>
    
    <div class="brand">
        <i class="bi bi-briefcase-fill"></i>
        <span class="brand-text">JobPortal</span>
    </div>
    
    <div class="user-info" sec:authorize="isAuthenticated()">
        <div class="user-avatar">
            <i class="bi bi-person-fill"></i>
        </div>
        <div class="user-details">
            <div class="user-name" sec:authentication="name">User</div>
            <div class="user-role" sec:authorize="hasRole('JOB_SEEKER')">Job Seeker</div>
            <div class="user-role" sec:authorize="hasRole('RECRUITER')">Recruiter</div>
            <div class="user-role" sec:authorize="hasRole('ADMIN')">Admin</div>
        </div>
    </div>
    
    <div class="sidebar-menu">
        <ul class="nav flex-column">
            <li class="nav-item" sec:authorize="hasRole('JOB_SEEKER')">
                <a class="nav-link" th:href="@{/job-seeker/dashboard}" data-title="Dashboard">
                    <i class="bi bi-speedometer2"></i><span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('JOB_SEEKER')">
                <a class="nav-link" th:href="@{/job-seeker/profile}" data-title="My Profile">
                    <i class="bi bi-person"></i><span>My Profile</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('JOB_SEEKER')">
                <a class="nav-link" th:href="@{/job-seeker/applications}" data-title="Applications">
                    <i class="bi bi-file-earmark-text"></i><span>Applications</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('JOB_SEEKER')">
                <a class="nav-link" th:href="@{/messages}" data-title="Messages">
                    <i class="bi bi-chat-dots"></i><span>Messages</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('JOB_SEEKER')">
                <a class="nav-link" th:href="@{/jobs}" data-title="Find Jobs">
                    <i class="bi bi-search"></i><span>Find Jobs</span>
                </a>
            </li>
            
            <li class="nav-item" sec:authorize="hasRole('RECRUITER')">
                <a class="nav-link" th:href="@{/recruiter/dashboard}" data-title="Dashboard">
                    <i class="bi bi-speedometer2"></i><span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('RECRUITER')">
                <a class="nav-link" th:href="@{/recruiter/profile}" data-title="Company Profile">
                    <i class="bi bi-building"></i><span>Company Profile</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('RECRUITER')">
                <a class="nav-link" th:href="@{/recruiter/jobs}" data-title="Manage Jobs">
                    <i class="bi bi-briefcase"></i><span>Manage Jobs</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('RECRUITER')">
                <a class="nav-link" th:href="@{/recruiter/applications}" data-title="Applications">
                    <i class="bi bi-people"></i><span>Applications</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('RECRUITER')">
                <a class="nav-link" th:href="@{/messages}" data-title="Messages">
                    <i class="bi bi-chat-dots"></i><span>Messages</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/dashboard}" data-title="Dashboard">
                    <i class="bi bi-speedometer2"></i><span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/users}" data-title="Manage Users">
                    <i class="bi bi-people"></i><span>Manage Users</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/jobs}" data-title="Manage Jobs">
                    <i class="bi bi-briefcase"></i><span>Manage Jobs</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/categories}" data-title="Categories">
                    <i class="bi bi-tags"></i><span>Categories</span>
                </a>
            </li>
        </ul>
    </div>
    
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light w-100">
                <i class="bi bi-box-arrow-right"></i><span>Logout</span>
            </button>
        </form>
    </div>
</aside>

<script th:inline="javascript">
(function() {
    var sidebar = document.getElementById('sidebar');
    var toggleBtn = document.getElementById('sidebarToggle');
    
    if (!sidebar || !toggleBtn) return;
    
    // Initialize collapsed state from localStorage
    var savedState = localStorage.getItem('sidebarCollapsed');
    if (savedState === 'true') {
        sidebar.classList.add('collapsed');
        sidebar.setAttribute('data-collapsed', 'true');
        updateIcon(true);
    }
    
    // Set active nav link
    var currentPath = window.location.pathname;
    var navLinks = sidebar.querySelectorAll('.nav-link');
    for (var i = 0; i < navLinks.length; i++) {
        if (navLinks[i].getAttribute('href') === currentPath) {
            navLinks[i].classList.add('active');
            break;
        }
    }
    
    // Toggle click handler - use direct event
    toggleBtn.onclick = function() {
        var isCollapsed = sidebar.classList.toggle('collapsed');
        sidebar.setAttribute('data-collapsed', isCollapsed);
        localStorage.setItem('sidebarCollapsed', isCollapsed);
        updateIcon(isCollapsed);
    };
    
    function updateIcon(isCollapsed) {
        var icon = toggleBtn.querySelector('i');
        if (icon) {
            if (isCollapsed) {
                icon.className = 'bi bi-chevron-right';
            } else {
                icon.className = 'bi bi-chevron-left';
            }
        }
    }
})();
</script>
