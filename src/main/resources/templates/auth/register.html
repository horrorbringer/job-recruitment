<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Register</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Create Account</h2>
                        
                        <form th:action="@{/register}" th:object="${registration}" method="post">
                            <div class="mb-4">
                                <label class="form-label fw-bold">I want to:</label>
                                <div class="row">
                                    <div class="col-6">
                                        <div class="form-check card p-3">
                                            <input class="form-check-input" type="radio" th:field="*{role}" value="JOB_SEEKER" id="seeker">
                                            <label class="form-check-label d-block" for="seeker">
                                                <i class="bi bi-person-badge display-6 d-block mb-2"></i>
                                                <strong>Find a Job</strong>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check card p-3">
                                            <input class="form-check-input" type="radio" th:field="*{role}" value="RECRUITER" id="recruiter">
                                            <label class="form-check-label d-block" for="recruiter">
                                                <i class="bi bi-building display-6 d-block mb-2"></i>
                                                <strong>Hire Talent</strong>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <span th:errors="*{role}" class="text-danger small"></span>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                                <span th:errors="*{email}" class="invalid-feedback"></span>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" th:field="*{password}" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" th:field="*{confirmPassword}" class="form-control">
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Create Account</button>
                        </form>
                        
                        <p class="text-center mt-3 mb-0">
                            Already have an account? <a th:href="@{/login}">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
