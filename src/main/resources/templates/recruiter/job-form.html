<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dashboard}">
<head>
    <title th:text="${jobId != null ? 'Edit Job' : 'Post New Job'} + ' | JobPortal'"></title>
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
<main layout:fragment="content" class="bg-light p-4 p-lg-5">
    <!-- Header Section -->
    <div class="row mb-5 align-items-center">
        <div class="col-md-8">
            <h2 class="fw-bold text-dark mb-1" th:text="${jobId != null ? 'Refine Job Posting' : 'Create New Opportunity'}">Post Job</h2>
            <p class="text-muted mb-0">Fill in the details below to attract the best talent for your team.</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <a th:href="@{/recruiter/jobs}" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-arrow-left me-2"></i>Back to My Jobs
            </a>
        </div>
    </div>
    
    <form id="jobForm" th:action="@{${jobId != null ? '/recruiter/jobs/' + jobId + '/edit' : '/recruiter/jobs/create'}}" th:object="${jobDTO}" method="post">
        <div class="row g-4">
            <!-- Left Column: Core Details -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
                    <div class="card-header bg-white border-0 p-4">
                        <h5 class="fw-bold mb-0">Role Information</h5>
                    </div>
                    <div class="card-body p-4 pt-0">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Job Title</label>
                            <input type="text" class="form-control form-control-premium" th:field="*{title}" placeholder="e.g. Senior Product Designer" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Professional Description</label>
                            <div id="descriptionEditor" style="height: 250px;"></div>
                            <input type="hidden" th:field="*{description}" id="descriptionInput">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Key Requirements</label>
                            <div id="requirementsEditor" style="height: 180px;"></div>
                            <input type="hidden" th:field="*{requirements}" id="requirementsInput">
                        </div>

                        <div class="mb-0">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Primary Responsibilities</label>
                            <div id="responsibilitiesEditor" style="height: 180px;"></div>
                            <input type="hidden" th:field="*{responsibilities}" id="responsibilitiesInput">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Metadata & Settings -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-header bg-white border-0 p-4">
                        <h5 class="fw-bold mb-0">Logistics & Compensation</h5>
                    </div>
                    <div class="card-body p-4 pt-0">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Work Location</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 rounded-start-3"><i class="bi bi-geo-alt"></i></span>
                                <input type="text" class="form-control form-control-premium rounded-start-0" th:field="*{location}" placeholder="City, Country" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Job Category</label>
                            <select class="form-select form-select-premium" th:field="*{categoryId}" required>
                                <option value="">Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Employment Type</label>
                            <select class="form-select form-select-premium" th:field="*{jobType}" required>
                                <option value="FULL_TIME">Full Time</option>
                                <option value="PART_TIME">Part Time</option>
                                <option value="CONTRACT">Contract</option>
                                <option value="INTERNSHIP">Internship</option>
                                <option value="REMOTE">Remote</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Experience Level</label>
                            <select class="form-select form-select-premium" th:field="*{experienceLevel}" required>
                                <option value="ENTRY_LEVEL">Entry Level</option>
                                <option value="MID_LEVEL">Mid Level</option>
                                <option value="SENIOR">Senior</option>
                                <option value="EXECUTIVE">Executive</option>
                            </select>
                        </div>

                        <hr class="my-4 text-muted opacity-25">

                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Min Salary</label>
                                <input type="number" class="form-control form-control-premium" th:field="*{salaryMin}" placeholder="0">
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Max Salary</label>
                                <input type="number" class="form-control form-control-premium" th:field="*{salaryMax}" placeholder="0">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Application Deadline</label>
                            <input type="date" class="form-control form-control-premium" th:field="*{deadline}" required>
                        </div>

                        <div class="mb-0">
                            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Open Positions</label>
                            <input type="number" class="form-control form-control-premium" th:field="*{vacancies}" min="1">
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 p-4">
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm">
                            <i class="bi bi-cloud-upload me-2"></i>
                            <span th:text="${jobId != null ? 'Apply Changes' : 'Publish Opportunity'}">Submit</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>

<th:block layout:fragment="scripts">
    <!-- Quill JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const quillOptions = {
                theme: 'snow',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['clean']
                    ]
                }
            };

            const editors = {
                description: new Quill('#descriptionEditor', quillOptions),
                requirements: new Quill('#requirementsEditor', quillOptions),
                responsibilities: new Quill('#responsibilitiesEditor', quillOptions)
            };

            // Set initial content if editing
            const initialContent = {
                description: /*[[${jobDTO.description}]]*/ '',
                requirements: /*[[${jobDTO.requirements}]]*/ '',
                responsibilities: /*[[${jobDTO.responsibilities}]]*/ ''
            };

            if (initialContent.description) editors.description.root.innerHTML = initialContent.description;
            if (initialContent.requirements) editors.requirements.root.innerHTML = initialContent.requirements;
            if (initialContent.responsibilities) editors.responsibilities.root.innerHTML = initialContent.responsibilities;

            // Sync on form submit
            const form = document.getElementById('jobForm');
            form.onsubmit = function() {
                document.getElementById('descriptionInput').value = editors.description.root.innerHTML;
                document.getElementById('requirementsInput').value = editors.requirements.root.innerHTML;
                document.getElementById('responsibilitiesInput').value = editors.responsibilities.root.innerHTML;
            };
        });
    </script>
</th:block>
</body>
</html>
