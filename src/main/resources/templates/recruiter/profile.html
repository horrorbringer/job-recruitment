<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dashboard}">
<head>
    <title>Company Profile</title>
</head>
<body>
<main layout:fragment="content">
    <h2 class="mb-4">Company Profile</h2>
    
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    
    <form th:action="@{/recruiter/profile}" th:object="${profileDTO}" method="post">
        <div class="card mb-4">
            <div class="card-body">
                <h5>Company Information</h5>
                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" class="form-control" th:field="*{companyName}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{companyDescription}" rows="4"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Website</label>
                    <input type="text" class="form-control" th:field="*{companyWebsite}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" th:field="*{companyLocation}">
                </div>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Save Profile</button>
    </form>
</main>
</body>
</html>
