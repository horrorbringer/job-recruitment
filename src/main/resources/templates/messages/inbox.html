<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dashboard}">
<head>
    <title>Messages | JobPortal</title>
</head>
<body>
<main layout:fragment="content" class="bg-light">
    <!-- Header -->
    <div class="row mb-5 align-items-center">
        <div class="col-md-8">
            <h2 class="fw-bold text-dark mb-1">Your Messages</h2>
            <p class="text-muted mb-0">Manage your conversations with candidates and recruiters.</p>
        </div>
    </div>

    <!-- Messages Layout -->
    <div class="row g-4">
        <div class="col-lg-12">
            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="card-body p-0">
                    <!-- Empty State -->
                    <div th:if="${#lists.isEmpty(messages)}" class="text-center py-5">
                        <div class="bg-light rounded-circle p-4 d-inline-block mb-3">
                            <i class="bi bi-chat-dots text-muted fs-1"></i>
                        </div>
                        <h5 class="fw-bold">No messages yet</h5>
                        <p class="text-muted">Conversations will appear here once you start communicating.</p>
                    </div>

                    <!-- Inbox List -->
                    <div class="list-group list-group-flush" th:unless="${#lists.isEmpty(messages)}">
                        <a th:each="msg : ${messages}" 
                           th:with="otherUser=${msg.sender.id == currentUser.id ? msg.receiver : msg.sender}"
                           th:href="@{/messages/chat/{id}(id=${otherUser.id})}"
                           class="list-group-item list-group-item-action p-4 transition-all">
                            
                            <div class="d-flex align-items-start">
                                <div class="avatar-md bg-soft-primary text-primary rounded-circle p-3 me-3" style="width: 55px; height: 55px; display: flex; align-items: center; justify-content: center;">
                                    <i class="bi bi-person fs-3"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <h6 class="fw-bold mb-0 text-dark" th:text="${otherUser.fullName}">User Name</h6>
                                        <small class="text-muted" th:text="${#temporals.format(msg.createdAt, 'dd MMM yyyy, HH:mm')}">Date</small>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <p class="text-secondary mb-0 small text-truncate" style="max-width: 80%;"
                                           th:text="${(msg.sender.id == currentUser.id ? 'You: ' : '') + msg.content}">
                                            Last message text goes here.
                                        </p>
                                        <span th:if="${!msg.isRead && msg.receiver.id == currentUser.id}" 
                                              class="badge bg-primary rounded-pill smaller">New</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
