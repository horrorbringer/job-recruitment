spring:
  application:
    name: recruitment-job

  datasource:
    url: jdbc:postgresql://localhost:5433/recruitment
    username: recruitment_user
    password: recruitment_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081
  error:
    path: /error

logging:
  level:
    com.recruitment: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

app:
  upload:
    dir: uploads
    resume:
      max-size: 5242880
      allowed-types: pdf,doc,docx
    image:
      max-size: 2097152
      allowed-types: jpg,jpeg,png,webp
