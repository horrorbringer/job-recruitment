spring:
  application:
    name: recruitment-job

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/recruitment}
    username: ${DB_USERNAME:recruitment_user}
    password: ${DB_PASSWORD:recruitment_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${JPA_FORMAT_SQL:true}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
    prefix: classpath:/templates/
    suffix: .html

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  error:
    path: /error

logging:
  level:
    com.recruitment: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
    resume:
      max-size: ${APP_UPLOAD_RESUME_MAX_SIZE:5242880}
      allowed-types: pdf,doc,docx
    image:
      max-size: ${APP_UPLOAD_IMAGE_MAX_SIZE:2097152}
      allowed-types: jpg,jpeg,png,webp
