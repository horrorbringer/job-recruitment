services:
  app:
    image: ${APP_IMAGE:-ghcr.io/your-github-username/recruitment-job:latest}
    container_name: recruitment_app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVER_PORT: 8081
      APP_UPLOAD_DIR: /data/uploads
      THYMELEAF_CACHE: true
      LOG_LEVEL_APP: INFO
      LOG_LEVEL_SQL: WARN
      LOG_LEVEL_SECURITY: INFO
    volumes:
      - ./uploads:/data/uploads
    expose:
      - "8081"

  nginx:
    image: nginx:1.27-alpine
    container_name: recruitment_nginx
    depends_on:
      - app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
