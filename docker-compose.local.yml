services:
  postgres:
    image: postgres:16-alpine
    container_name: recruitment_db_local
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment_user
      POSTGRES_PASSWORD: recruitment_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment_user -d recruitment"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_app_local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/recruitment
      DB_USERNAME: recruitment_user
      DB_PASSWORD: recruitment_pass
      SERVER_PORT: 8081
      APP_UPLOAD_DIR: /data/uploads
      THYMELEAF_CACHE: false
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: true
      JPA_FORMAT_SQL: true
      LOG_LEVEL_APP: DEBUG
      LOG_LEVEL_SQL: DEBUG
      LOG_LEVEL_SECURITY: INFO
    volumes:
      - ./uploads:/data/uploads
    expose:
      - "8081"

  nginx:
    image: nginx:1.27-alpine
    container_name: recruitment_nginx_local
    depends_on:
      - app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data_local:
